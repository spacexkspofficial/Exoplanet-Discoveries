name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package
        # `fits` (emcee, batman, corner) is not optional for the test suite:
        # tests/test_transitfit.py exercises the T8 fitter, and without emcee
        # `fit_transit` short-circuits to "emcee is not installed" so four
        # tests assert against the wrong branch. Installing only `[dev]` made
        # CI red on every push from 2026-08-09.
        run: python -m pip install -e ".[dev,fits]"

      - name: Check Python dependencies
        run: python -m pip check

      - name: Run Python tests
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
