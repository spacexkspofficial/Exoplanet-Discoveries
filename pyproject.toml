[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "exohunt-starter"
version = "0.1.0"
description = "A small, reproducible TESS transit-search starter project"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "astropy>=6.0,<8",
  "astroquery>=0.4.7,<1",
  "fastapi>=0.116,<1",
  "filelock>=3.13,<4",
  "lightkurve>=2.5,<3",
  "matplotlib>=3.8,<4",
  "numba>=0.59",
  "numpy>=1.26,<3",
  "psutil>=5.9",
  "reportlab>=4.2,<5",
  "requests>=2.31,<3",
  # Arrives transitively through lightkurve and wotan, but correction 82 imports
  # `scipy.stats.poisson` directly to score epoch bins against their own
  # expectation. A direct import resting on someone else's dependency is the
  # kind of thing that turns green locally and red on a clean install.
  "scipy>=1.11",
  # transitleastsquares imports batman, whose openmp probe imports distutils;
  # on Python 3.12 distutils only exists through setuptools' shim.
  "setuptools>=69",
  "transitleastsquares>=1.0.31",
  "uvicorn>=0.35,<1",
  "wotan>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
geometry = ["tess-point==0.9.2"]
fits = ["batman-package>=2.4.9", "emcee>=3.1", "corner>=2.2"]

[project.scripts]
exohunt = "exohunt.cli:main"
exohunt-dashboard = "exohunt.dashboard_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exohunt = ["status_registry.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
